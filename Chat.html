<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRUEAI Chatbot</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080d1b;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    padding: 18px;
    background: #10182b;
    border-bottom: 1px solid #263854;
}

header h2 {
    color: #65a7ff;
}

header p {
    color: #aab6c9;
    font-size: 12px;
    margin-top: 5px;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
}

.message {
    padding: 13px 15px;
    border-radius: 12px;
    margin-bottom: 14px;
    max-width: 88%;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.bot {
    background: #17243c;
    border: 1px solid #2b4265;
}

.user {
    background: #2869d8;
    margin-left: auto;
}

.input-area {
    display: flex;
    gap: 9px;
    padding: 13px;
    background: #10182b;
    border-top: 1px solid #263854;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: 1px solid #34496d;
    border-radius: 10px;
    background: #17243c;
    color: white;
    outline: none;
    font-size: 15px;
}

button {
    padding: 0 18px;
    background: #3478f6;
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: bold;
}

button:disabled {
    opacity: 0.5;
}

</style>
</head>

<body>

<header>
    <h2>TRUEAI 🤖</h2>
    <p>Your AI Assistant | One Platform. Infinite Possibilities.</p>
</header>

<div id="messages">
    <div class="message bot">
        Hello! Welcome to TRUEAI.

        I am your AI assistant interface.
        Ask me anything!
    </div>
</div>

<div class="input-area">
    <input
        id="userInput"
        type="text"
        placeholder="Ask TRUEAI anything..."
    >
    <button id="sendButton" onclick="sendMessage()">Send</button>
</div>

<script>

const input = document.getElementById("userInput");
const messages = document.getElementById("messages");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function sendMessage() {
    const question = input.value.trim();

    if (!question) return;

    addMessage(question, "user");
    input.value = "";

    addMessage(
        "Your message has been received! The AI connection is not configured yet. We will connect the AI engine in the next stage.",
        "bot"
    );
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

</script>

</body>
</html>
